ou were my air\n当たり前だと思ってた　君の存在が\n僕の命を繋ぐ　全てだったんだ\n今さら叫んでも　届かない声\n薄れていく意識の中\n君の名前をただ　呼んでいる\n\n[Bridge]\n[Vocal: Breathless, desperate, soaring falsetto]\n(Gasp for breath)\n苦しくて　苦しくて\n胸を掻きむしっても\n君という空気がなければ\n僕は一秒だって　生きていけないのに\n\n[Guitar / Piano Solo]\n[Instrumental: Emotional, sweeping strings, dramatic build]\n\n[Chorus]\n[Vocal: Maximum intensity, raw emotion, crying tone]\nYou were my air\n失って初めて知る　君の尊さを\n抱きしめ直すことすら　許されないなら\n君のいないこの部屋で\n僕の呼吸を　止めてくれ\n\n[Outro]\n[Vocal: Whispery, fading, exhausted]\n(Deep exhale)\n冷たい静寂の中\n君がいない\n息が… できない…\n[Fade out]\n[End]\n38:[\"$\",\"$L44\",null,{\"clip\":{\"status\":\"complete\",\"title\":\"Air...\",\"play_count\":12,\"upvote_count\":1,\"allow_comments\":true,\"is_verified\":false,\"id\":\"02676cd6-745f-404a-9314-ae11d1346819\",\"entity_type\":\"song_schema\",\"video_url\":\"\",\"audio_url\":\"https://studio-api.prod.suno.com/api/forbidden\",\"media_urls\":[{\"url\":\"https://d2lwuy8qc234o3.cloudfront.net/1/clip/02676cd6-745f-404a-9314-ae11d1346819.m4a\",\"content_type\":\"m4a-opus\",\"delivery\":\"progressive\",\"encoding\":\"1.0.0\"}],\"image_url\":\"https://cdn2.suno.ai/image_02676cd6-745f-404a-9314-ae11d1346819.jpeg\",\"image_large_url\":\"https://cdn2.suno.ai/image_large_02676cd6-745f-404a-9314-ae11d1346819.jpeg\",\"major_model_version\":\"v5.5\",\"model_name\":\"chirp-fenix\",\"metadata\":{\"tags\":\"k-pop medium tempo dance ballad, dramatic r\u0026b, passionate vocal performance, crisp trap-infused percussion, emotive string arrangement, rhythmic bassline, soaring chorus, melancholic yet energetic\\n\",\"prompt\":\"$45\",\"edited_clip_id\":\"00000000-0000-0000-0000-000000000000\",\"type\":\"gen\",\"duration\":273.68,\"refund_credits\":false,\"stream\":true,\"has_vocal\":false,\"can_publish_with_vocal\":true,\"make_instrumental\":false,\"cover_clip_id\":\"00000000-0000-0000-0000-000000000000\",\"task\":\"cover\",\"can_remix\":true,\"is_remix\":true,\"priority\":10,\"has_stem\":false,\"video_is_stale\":true,\"uses_latest_m
